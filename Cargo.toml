[workspace]
members = [
    "crates/system_info_collector_core",
    "crates/system_info_collector",
]
resolver = "2"

# Local patch: vendor/plotly adds xaxis9-12/yaxis9-12/zaxis9-12 to the upstream
# Layout struct (which stops at axis 8), so the exported HTML report can have
# more than 8 chart rows. See vendor/plotly/src/layout/mod.rs for the diff.
[patch.crates-io]
plotly = { path = "vendor/plotly" }

[workspace.package]
version = "0.7.0"
authors = ["Rafał Mikrut <qarminkrut@gmail.com>"]
edition = "2024"
rust-version = "1.92.0"
license = "MIT"
homepage = "https://github.com/qarmin/system-info-collector"
repository = "https://github.com/qarmin/system-info-collector"

[profile.rdebug]
inherits = "release"
debug = "full"
strip = "none"

[workspace.lints.clippy]
unreachable = "allow"
enum_variant_names = "allow"
too_many_arguments = "allow"
useless_let_if_seq = "allow"
needless_range_loop = "allow"

allow_attributes = "warn"
assertions_on_result_states = "warn"
bool_to_int_with_if = "warn"
branches_sharing_code = "warn"
collection_is_never_read = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
empty_enum_variants_with_brackets = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
error_impl_error = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
expl_impl_clone_on_copy = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp = "warn"
from_iter_instead_of_collect = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
index_refutable_slice = "warn"
invalid_upcast_comparisons = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_with_drain = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wildcard_for_single_variants = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
mut_mut = "warn"
needless_bitwise_bool = "warn"
needless_collect = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_raw_strings = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
pathbuf_init_then_push = "warn"
path_buf_push_overwrite = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_underscore_fields = "warn"
question_mark = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_clone = "warn"
redundant_else = "warn"
ref_binding_to_reference = "warn"
ref_option_ref = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
set_contains_or_insert = "warn"
stable_sort_primitive = "warn"
string_add_assign = "warn"
string_slice = "warn"
suspicious_operation_groupings = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
trivial_regex = "warn"
type_repetition_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
unnecessary_join = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_result_ok = "warn"
unused_rounding = "warn"
unused_self = "warn"
unwrap_used = "warn"
used_underscore_binding = "warn"
use_self = "warn"
verbose_file_reads = "warn"
wildcard_imports = "warn"

[profile.release]
opt-level = 3
debug = false
panic = "abort"
lto = "fat"
codegen-units = 1
