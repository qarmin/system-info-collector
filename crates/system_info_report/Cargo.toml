[package]
name = "system_info_report"
description = "Summaries, tables, CSV/JSON export, SVG charts and benchmarks over system_info_probe recordings"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
system_info_probe = { path = "../system_info_probe", version = "0.8.0", default-features = false }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["float_roundtrip"], optional = true }
tokio = { version = "1.53", features = ["rt"], optional = true }
plotly = { version = "0.14", optional = true }

[features]
default = ["disk", "network"]
disk = ["system_info_probe/disk"]
network = ["system_info_probe/network"]
json = ["dep:serde", "dep:serde_json", "system_info_probe/serde"]
tokio = ["dep:tokio", "system_info_probe/tokio"]
html = ["dep:plotly"]

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
