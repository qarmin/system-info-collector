[package]
name = "system_info_collector"
description = "Simple and fast application to collect os information and create graphs based on it"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
system_info_collector_core = { path = "../system_info_collector_core", version = "0.8.0", features = ["clap"] }

time = "0.3"
ctrlc = { version = "3.5", features = ["termination"] }
sysinfo = { version ="0.39", default-features = false, features = ["component", "network", "system"] }
tokio = { version = "1.53", features = ["full"] }
handsome_logger = "0.9"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
open = "5.4"
plotly = "0.14"
anyhow = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
humansize = "2.1.3"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13.1"
os_info = "3.15.0"
axum = { version = "0.8", features = ["ws"] }
serde_json = "1.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
