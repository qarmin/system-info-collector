[package]
name = "system_info_collector"
description = "Simple and fast application to collect os information and create graphs based on it"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
system_info_report = { path = "../system_info_report", version = "0.8.0", default-features = false, features = ["html"] }

time = "0.3"
ctrlc = { version = "3.5", features = ["termination"] }
system_info_probe = { path = "../system_info_probe", version = "0.8.0", features = ["gpu-nvidia", "gpu-amd", "gpu-intel", "gpu-vivante", "ping", "tokio"] }
tokio = { version = "1.54", features = ["full"] }
handsome_logger = "0.10"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
open = "5.4"
anyhow = "1.0"
chrono = { version = "0.4.45", features = ["serde"] }
humansize = "2.1.3"
clap = { version = "4.6", features = ["derive"] }
os_info = "3.15.0"
axum = { version = "0.8", features = ["ws"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
