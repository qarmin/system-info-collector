[package]
name = "system_info_collector_core"
description = "Core library for system_info_collector - concurrent data collection engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
system_info_probe = { path = "../system_info_probe", version = "0.8.0", features = ["gpu-nvidia", "gpu-amd", "gpu-intel", "gpu-vivante", "ping", "tokio"] }
tokio = { version = "1.53", features = ["full"] }
anyhow = "1.0"
log = "0.4"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
clap = { version = "4.6", features = ["derive"], optional = true }
humansize = "2.1.3"

[features]
clap = ["dep:clap"]
